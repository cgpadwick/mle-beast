<div class="stage-dashboard">
    {% for name in stage_order %}
    {% set stage = stages[loop.index0] %}
    {% if stage %}
    <div class="stage-card {{ stage.status }}">
        <h3>{{ name }}</h3>
        <div class="stage-status">
            <span class="badge {{ status_badge_class(stage.status) }}">{{ stage.status }}</span>
        </div>
        {% if stage.attempt > 0 %}
        <div class="stage-attempt">Attempt {{ stage.attempt }}/{{ stage.max_attempts }}</div>
        {% endif %}
    </div>
    {% else %}
    <div class="stage-card">
        <h3>{{ name }}</h3>
        <div class="stage-status">
            <span class="badge badge-pending">pending</span>
        </div>
    </div>
    {% endif %}
    {% endfor %}
</div>
