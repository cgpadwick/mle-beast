[project]
name = "mle-beast"
version = "1.1.0"
description = "LLM-driven ML engineering agent — automatically generate, test, train, and improve ML models via actor/critic hill-climbing"
license = { text = "Apache-2.0" }
authors = [{ name = "Chris Padwick", email = "cgpadwick@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "pocketflow",
    "instructor",
    "openai",
    "litellm",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pytest>=8.0",
    # python-dotenv is loaded best-effort in __main__.py; we soft-fallback
    # to a stdlib parser if it's missing, but ship it as a dep so the
    # typical install path gets robust .env parsing (export prefixes,
    # quoting, interpolation).
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "python-multipart",
]
dev = [
    "ruff>=0.6",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/cgpadwick/mle-beast"
Repository = "https://github.com/cgpadwick/mle-beast"
Issues = "https://github.com/cgpadwick/mle-beast/issues"

[project.scripts]
mle-beast = "mle_beast.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the built React SPA inside the wheel. `npm run build` populates
# this directory before `pip install` / `pip wheel`; if you're building
# from a source checkout that hasn't run npm build, the dashboard mount
# is skipped at runtime and the user can either rebuild or run with
# --no-web.
"mle_beast.web" = ["static/**/*"]
# Ship the AGENTS.md template (and any future templates) inside the
# wheel so `mle-beast init` can copy them from `importlib.resources`.
"mle_beast.templates" = ["*.md", "*.txt", "*.yaml"]
# Safety policy loaded by mle_beast.safety at import time.
"mle_beast.safety" = ["*.json"]

[tool.pytest.ini_options]
markers = [
    "integration: full end-to-end integration tests (require API key)",
    "timeout: test timeout in seconds",
]
norecursedirs = ["templates"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "tests/integration/*/templates",
    "prototypes",
]

[tool.ruff.lint]
# E,W: pycodestyle errors/warnings. F: pyflakes. I: isort. B: flake8-bugbear.
# UP: pyupgrade. Lenient enough to not be hostile; strict enough to catch
# real issues (unused imports, mutable default args, deprecated syntax).
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # function call in default arg — FastAPI uses Query(...) etc.
    "UP006", # use list[...] instead of List[...] — sweep separately
    "UP007", # use X | Y instead of Union — sweep separately
    "UP035", # typing.X deprecated — sweep separately
    "UP045", # use X | None instead of Optional[X] — sweep separately
]

[tool.coverage.run]
source = ["src/mle_beast"]
omit = [
    "src/mle_beast/web/templates/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
