version: "1.0"

project:
  name: churn_existing
  description: >
    Improve an existing churn prediction classifier. Existing code provides
    a baseline model, training, evaluation, and tests. The agent should
    improve accuracy to meet the target.

goals:
  task_type: improve_existing
  task_description: >
    Improve the existing churn prediction classifier to achieve at least
    75% accuracy on the held-out test set. The existing code has a
    simple model (train.py + evaluate.py + model.py + tests/). Review the
    code, propose targeted improvements (feature engineering, model
    architecture, regularization, etc.), and apply them via the hill-climb
    Propose/Implement loop. Each kept iteration must demonstrably raise
    val_accuracy. Do NOT create versioned files — edit the existing
    files in place. The pipeline runs evaluate.py on the held-out
    test.csv to measure each iteration's score.
  target_metric:
    name: accuracy
    target_value: 0.75
    comparison: ">="

dataset:
  type: tabular
  train_path: train.csv
  test_path: test.csv

workspace:
  existing_code: true
  environment:
    type: venv
    path: venv
