name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Tip — the dashboard fills most of this in for
        you: **Settings → Found a bug?**, or **Report this run** on a failed
        run, opens an issue pre-populated with your version + environment.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mle-beast version
      description: Shown in the dashboard hero, or run `pip show mle-beast`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Docker (docker compose / setup wizard)
        - Native (pipx / pip)
    validations:
      required: true
  - type: dropdown
    id: gpu
    attributes:
      label: GPU
      options:
        - NVIDIA GPU (CUDA)
        - CPU only
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Ubuntu 22.04, macOS 14, WSL2
    validations:
      required: true
  - type: input
    id: provider-model
    attributes:
      label: LLM provider + model
      placeholder: e.g. OpenRouter / deepseek/deepseek-v4-flash
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant log lines or the full error/traceback. For long output, attach a file.
      render: shell
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
